<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설아 영어단어 퀴즈 1회차</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff8ef;--card:#ffffff;--ink:#2b2a33;--sub:#7a7584;--accent:#f07b3f;--accent2:#ffd36e;--ok:#2e9e6a;--okbg:#e6f6ee;--no:#d64545;--nobg:#fdeaea;--line:#efe6da}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,sans-serif;font-size:20px;line-height:1.55}
  .wrap{max-width:600px;margin:0 auto;padding:20px 16px 48px}
  h1{font-family:"Nunito","Gowun Dodum",sans-serif;font-size:24px;margin:4px 0 2px}
  .muted{color:var(--sub);font-size:16px}
  .card{background:var(--card);border-radius:22px;padding:26px 22px;box-shadow:0 6px 24px rgba(120,80,30,.08);margin-top:16px}
  .bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0;transition:width .3s}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:17px;color:var(--sub);margin-top:8px}
  .tag{display:inline-block;font-size:16px;padding:5px 13px;border-radius:99px;background:#fff1e3;color:#b9541f;font-weight:bold}
  .tag.sp{background:#e9f0ff;color:#3559c7}
  .prompt{font-family:"Nunito","Gowun Dodum",sans-serif;font-size:44px;font-weight:800;margin:14px 0 4px;word-break:keep-all}
  .prompt.ko{font-family:"Gowun Dodum",sans-serif;font-size:31px;font-weight:700}
  .hint{color:var(--sub);font-size:18px;letter-spacing:2px;margin-bottom:12px;font-family:monospace}
  input[type=text]{width:100%;font-size:25px;padding:18px 18px;border:2px solid var(--line);border-radius:14px;outline:none;font-family:inherit;background:#fffdf9}
  input[type=text]:focus{border-color:var(--accent)}
  button{font-family:inherit;font-size:22px;font-weight:bold;border:0;border-radius:16px;padding:18px 20px;cursor:pointer;width:100%;margin-top:12px;background:var(--accent);color:#fff}
  button.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
  button.soft{background:#f3ece3;color:var(--ink)}
  button:disabled{opacity:.5}
  .fb{margin-top:14px;border-radius:14px;padding:14px 16px;display:none}
  .fb.ok{display:block;background:var(--okbg);color:var(--ok)}
  .fb.no{display:block;background:var(--nobg);color:var(--no)}
  .fb b{font-size:23px}
  .fb .ans{color:var(--ink);margin-top:6px}
  .score{font-family:"Nunito",sans-serif;font-size:68px;font-weight:800;text-align:center;margin:6px 0 0;color:var(--accent)}
  .center{text-align:center}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:18px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--sub);font-weight:normal;font-size:15px}
  td.w{font-family:"Nunito",sans-serif;font-weight:800}
  td.mine{color:var(--no)}
  .copied{color:var(--ok);font-size:14px;text-align:center;margin-top:6px;min-height:20px}
  .start li{margin:4px 0}
  .row{display:flex;gap:10px}.row button{flex:1}
  .pg{display:flex;align-items:flex-end;gap:10px;margin:10px 0 -6px}
  .pg svg{width:125px;height:125px;flex:none}
  .pg.big svg{width:200px;height:200px}
  .pg.big{justify-content:center}
  .bubble{background:#fff;border-radius:18px;padding:10px 16px;box-shadow:0 3px 12px rgba(120,80,30,.1);font-size:19px;margin-bottom:22px;position:relative}
  .bubble:after{content:"";position:absolute;left:-7px;bottom:12px;border:7px solid transparent;border-right-color:#fff;border-left:0}
  .hop{animation:hop .5s ease}
  .shake{animation:shake .5s ease}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  .quote{margin-top:22px;background:#fff3c9;border-radius:20px;padding:18px 20px;text-align:center}
  .quote .lab{font-size:15px;color:#b98a12;font-weight:bold}
  .quote .en{font-family:"Nunito",sans-serif;font-weight:800;font-size:22px;margin-top:6px}
  .quote .ko{font-size:19px;margin-top:4px}
  .quote .by{font-size:15px;color:var(--sub);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
    <div id="app"></div>
  <div class="quote" id="quote"></div>
</div>

<script>
// [단어, 품사, 정답 뜻(표시용), 인정 키워드, 출처]
const WORDS = [
 ["slime","n.","슬라임, 끈적끈적한 물질","슬라임,끈적","L4"],

 ["full","형","가득한, 완전한, 배부른","가득,완전,배부","D24"],

 ["shape","명/동","모양, 모습, (~한) 모양으로 만들다","모양,모습,형태","D24"],

 ["tiny","형","조그마한, 아주 작은","조그마,조그만,작은,자그마","D24"],

 ["a variety of","","다양한, 여러 가지의","다양,여러","D24"],

 ["speed","명/동","속도, 속력, 신속, 빨리 가다","속도,속력,신속,빨리","D25"],
 ["mystery","명","불가사의, 신비","불가사의,신비,미스터리","D25"],
 ["everything","대","모든 것, 모두","모든,모두","D25"],
 ["during","전","~ 동안, ~하는 중에","동안,중에","D25"],
 ["excellent","형","훌륭한, 우수한","훌륭,우수","D25"],
 ["surprising","형","놀라운, 의외의","놀라,의외","D25"],
 ["shocking","형","충격적인","충격","D25"],
 ["covered with","","~으로 뒤덮인","덮인,덮여,뒤덮,덮힌","D25"],
 ["dramatic","형","극적인","극적","D25"],
 ["suddenly","부","갑자기","갑자기,갑작","D25"],
 ["unbelievable","형","믿을 수 없는, 믿기 어려운","믿을수없,믿기어려,믿을수가없,믿기힘","D25"],
 ["ordinary","형","보통의, 평범한","보통,평범","D25"],
 ["situation","명","상황, 처지, 입장","상황,처지,입장","D25"],
 ["familiar","형","친숙한, 익숙한, 잘 알고 있는","친숙,익숙,잘알,정통","D25"],
 ["describe","동","묘사하다, 서술하다","묘사,서술,설명","D25"],
 ["among","전","~ 중에서, ~에 둘러싸여","중에서,사이,둘러싸","D25"],
 ["unfortunately","부","불행하게도, 유감스럽게도","불행,유감","D25"],
 ["in addition","","게다가, 덧붙여","게다가,덧붙,추가로","D25"]
];
const RATIO = 0.8;


function penguin(mood){
  const eyes = mood==="happy"
    ? '<path d="M44 55 q4 -5 8 0" stroke="#1f1f24" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M68 55 q4 -5 8 0" stroke="#1f1f24" stroke-width="3" fill="none" stroke-linecap="round"/>'
    : mood==="sad"
    ? '<circle cx="48" cy="55" r="3.8" fill="#1f1f24"/><circle cx="72" cy="55" r="3.8" fill="#1f1f24"/><path d="M43 48 l8 3 M77 48 l-8 3" stroke="#1f1f24" stroke-width="2.2" stroke-linecap="round"/><path d="M47 61 q-3 6 0 8 q3 -2 0 -8" fill="#7cc4ff"/>'
    : '<circle cx="48" cy="55" r="4.3" fill="#1f1f24"/><circle cx="72" cy="55" r="4.3" fill="#1f1f24"/><circle cx="49.4" cy="53.5" r="1.4" fill="#fff"/><circle cx="73.4" cy="53.5" r="1.4" fill="#fff"/>';
  const nose = mood==="sad" ? '<ellipse cx="60" cy="60" rx="6" ry="4" fill="#8a4a2a"/>' : '<ellipse cx="60" cy="59" rx="6.5" ry="4.5" fill="#8a4a2a"/><ellipse cx="58" cy="57.5" rx="2" ry="1" fill="#b06a45"/>';
  const mouth = mood==="happy" ? '<path d="M56 66 q4 4 8 0" stroke="#8a4a2a" stroke-width="2" fill="none" stroke-linecap="round"/>' : '';
  let petals=""; for(let i=0;i<10;i++){petals+=`<ellipse cx="60" cy="19" rx="13" ry="13" fill="#ffd84d" stroke="#f0bf2a" stroke-width="1.2" transform="rotate(${i*36+18} 60 52)"/>`}
  let star=""; for(let i=0;i<5;i++){star+=`<ellipse cx="30" cy="85" rx="4.5" ry="6" fill="#ffd84d" stroke="#f0bf2a" stroke-width="1" transform="rotate(${i*72} 30 92)"/>`}
  return `<svg viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg" class="${mood==="happy"?"hop":mood==="sad"?"shake":""}">
    <ellipse cx="60" cy="126" rx="28" ry="3.5" fill="rgba(0,0,0,.08)"/>
    <ellipse cx="49" cy="122" rx="8" ry="4" fill="#9d8f84"/><ellipse cx="71" cy="122" rx="8" ry="4" fill="#9d8f84"/>
    <path d="M30 78 q-12 10 -8 24" stroke="#d6c7b8" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M90 78 q12 10 8 24" stroke="#d6c7b8" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M32 74 q-6 48 28 47 q34 1 28 -47 z" fill="#b3a397"/>
    ${petals}
    <circle cx="60" cy="52" r="29" fill="#5f5f66"/>
    <path d="M33 58 q0 -18 13 -22 q8 -2 14 6 q6 -8 14 -6 q13 4 13 22 q0 20 -27 20 q-27 0 -27 -20 z" fill="#fbf3e6"/>
    <circle cx="41" cy="64" r="4.5" fill="#ff9e9e" opacity=".75"/><circle cx="79" cy="64" r="4.5" fill="#ff9e9e" opacity=".75"/>
    ${eyes}${nose}${mouth}
    <path d="M84 82 L34 108" stroke="#2b2b30" stroke-width="3.2" stroke-linecap="round"/>
    ${star}<circle cx="30" cy="92" r="4" fill="#e86a2e"/>
  </svg>`;
}
const CHEER=["화이팅! 🐧","할 수 있어!","천천히 생각해 봐","설아 최고!","거의 다 왔어!"];
const $app = document.getElementById("app");
let qs = [], idx = 0, results = [], answered = false, dbRef = null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function normKo(s){return s.replace(/[\s~()（）\[\]…\.\-·'"]/g,"")}
function normEn(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ").trim()}

function checkMeaning(ans, keys){
  const parts = ans.split(/[,，\/、]/).map(normKo).filter(Boolean);
  const ks = keys.split(",").map(normKo);
  return parts.some(p => ks.some(k => k.length===1 ? (p===k || p===k+"의" || p.startsWith(k+"은") || p.startsWith(k+"게")) : p.includes(k)));
}

function makeQuiz(pool){
  const n = pool===WORDS ? Math.round(WORDS.length*RATIO) : pool.length;
  return shuffle(pool).slice(0,n).map(w=>({w, type: Math.random()<0.5 ? "meaning" : "spell"}));
}

function start(pool, label){
  qs = makeQuiz(pool); idx = 0; results = []; window.__label = label || "전체";
  renderQ();
}

function renderIntro(){
  $app.innerHTML = `
  <div class="card start">
    <p style="margin-top:0">설아야, 오늘 단어 시험이야! ✏️</p>
    <ul>
      <li>전체 <b>${WORDS.length}개</b> 단어 중 <b>${Math.round(WORDS.length*RATIO)}문제</b>가 무작위로 나와</li>
      <li><span class="tag">뜻 쓰기</span> 영어를 보고 한국어 뜻 쓰기</li>
      <li><span class="tag sp">철자 쓰기</span> 뜻을 보고 영어 철자 쓰기</li>
      <li>뜻이 여러 개면 <b>하나만</b> 맞게 써도 정답!</li>
      <li>다 풀면 결과 화면을 <b>캡처해서 아빠한테</b> 보내줘 📸</li>
    </ul>
    <button id="go">시작하기</button>
  </div>`;
  document.getElementById("go").onclick = ()=>start(WORDS,"전체");
}

function renderQ(){
  answered = false;
  const q = qs[idx], w = q.w;
  const isSp = q.type==="spell";
  const hint = isSp ? w[0].split("").map(c=>c===" "?"  ":"_").join(" ") + `  (${w[0].replace(/ /g,"").length}글자)` : (w[1]?w[1]:"");
  $app.innerHTML = `
  <div class="bar"><i style="width:${idx/qs.length*100}%"></i></div>
  <div class="top"><span>${idx+1} / ${qs.length}</span><span>맞은 개수 ${results.filter(r=>r.ok).length}</span></div>
  <div class="pg" id="pg">${penguin("normal")}<div class="bubble" id="bub">${CHEER[Math.floor(Math.random()*CHEER.length)]}</div></div>
  <div class="card">
    <span class="tag ${isSp?"sp":""}">${isSp?"철자 쓰기":"뜻 쓰기"}</span>
    <div class="prompt ${isSp?"ko":""}">${esc(isSp?w[2]:w[0])}</div>
    <div class="hint">${esc(hint)}</div>
    <form id="f" autocomplete="off">
      <input type="text" id="a" placeholder="${isSp?"영어로 써 보세요":"한국어 뜻을 써 보세요"}" autocapitalize="off" autocorrect="off" spellcheck="false" lang="${isSp?"en":"ko"}">
      <button id="btn" type="submit">확인</button>
    </form>
    <div class="fb" id="fb"></div>
  </div>`;
  const inp = document.getElementById("a"); inp.focus();
  document.getElementById("f").onsubmit = e=>{
    e.preventDefault();
    if(answered){ next(); return; }
    const v = inp.value.trim();
    if(!v){ inp.focus(); return; }
    const ok = isSp ? normEn(v)===normEn(w[0]) : checkMeaning(v, w[3]);
    results.push({word:w[0], meaning:w[2], type:q.type, mine:v, ok});
    answered = true; inp.readOnly = true;
    document.getElementById("pg").innerHTML = penguin(ok?"happy":"sad") + `<div class="bubble">${ok?"정답! 잘했어 🌻":"괜찮아, 다시 외우자!"}</div>`;
    const fb = document.getElementById("fb");
    fb.className = "fb " + (ok?"ok":"no");
    fb.innerHTML = ok
      ? `<b>정답! 🎉</b><div class="ans">${esc(w[0])} = ${esc(w[2])}</div>`
      : `<b>아쉬워요 😢</b><div class="ans">정답: <b>${esc(w[0])}</b> = ${esc(w[2])}</div>`;
    document.getElementById("btn").textContent = idx+1<qs.length ? "다음 문제 →" : "결과 보기";
    document.getElementById("btn").focus();
  };
}

function next(){ idx++; if(idx<qs.length) renderQ(); else renderResult(); }

function today(){const d=new Date();return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}

function resultText(){
  const ok = results.filter(r=>r.ok).length, wrong = results.filter(r=>!r.ok);
  let t = `[설아 영어단어 퀴즈] ${today()} (${window.__label})\n점수: ${ok} / ${results.length} (${Math.round(ok/results.length*100)}점)\n`;
  if(wrong.length){ t += `\n틀린 단어 ${wrong.length}개\n` + wrong.map((r,i)=>`${i+1}. ${r.word} = ${r.meaning} (${r.type==="spell"?"철자":"뜻"} / 내 답: ${r.mine})`).join("\n"); }
  else t += "\n모두 맞았어요! 💯";
  return t;
}

function renderResult(){
  const ok = results.filter(r=>r.ok).length, wrong = results.filter(r=>!r.ok);
  const pct = Math.round(ok/results.length*100);
  const msg = pct===100?"완벽해! 최고야 💯":pct>=80?"정말 잘했어! 👏":pct>=60?"좋아, 조금만 더! 💪":"틀린 단어만 다시 해 보자! 🔁";
  $app.innerHTML = `
  <div class="pg big">${penguin(pct>=60?"happy":"sad")}</div>
  <div class="card center">
    <div class="muted">${today()} · ${esc(window.__label)}</div>
    <div class="score">${ok} / ${results.length}</div>
    <div style="font-size:20px;font-weight:bold">${pct}점 · ${msg}</div>
  </div>
  ${wrong.length?`<div class="card">
    <b>틀린 단어 ${wrong.length}개</b> <span class="muted">아래 메일 버튼으로 아빠한테 보내줘</span>
    <table><tr><th>단어</th><th>정답 뜻</th><th>내 답</th></tr>
    ${wrong.map(r=>`<tr><td class="w">${esc(r.word)}</td><td>${esc(r.meaning)}</td><td class="mine">${esc(r.mine)}<br><span class="muted">${r.type==="spell"?"철자":"뜻"}</span></td></tr>`).join("")}
    </table></div>`:""}
  <div class="card">
    <button id="mail">📧 아빠한테 메일 보내기</button>
    <button class="ghost" id="copy">결과 복사하기</button>
    <div class="copied" id="cp"></div>
    ${wrong.length?`<button class="ghost" id="retry">틀린 단어만 다시 풀기 (${wrong.length}개)</button>`:""}
    <button class="soft" id="again">처음부터 새로 풀기</button>
  </div>`;
  document.getElementById("mail").onclick = ()=>{
    const to = atob("Y2hvaW5rdWVAZ21haWwuY29t");
    const subj = `[설아 단어퀴즈] ${window.__label} ${ok}/${results.length} (${pct}점)`;
    location.href = "mailto:" + to + "?subject=" + encodeURIComponent(subj) + "&body=" + encodeURIComponent(resultText());
    document.getElementById("cp").textContent = "메일 앱이 열리면 '보내기'를 눌러줘 📨";
  };
  document.getElementById("copy").onclick = async ()=>{
    try{ await navigator.clipboard.writeText(resultText()); document.getElementById("cp").textContent="복사됐어! 문자에서 아빠한테 붙여넣기 해줘 ✅"; }
    catch(e){ document.getElementById("cp").textContent="복사가 안 돼요. 화면을 캡처해서 보내주세요 📸"; }
  };
  if(wrong.length) document.getElementById("retry").onclick = ()=>{
    const pool = WORDS.filter(w=>wrong.some(r=>r.word===w[0])); start(pool,"오답 다시 풀기");
  };
  document.getElementById("again").onclick = ()=>start(WORDS,"전체");
}
