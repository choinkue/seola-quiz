<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설훈이의 공부방</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>

  :root{--bg:#eef7ff;--card:#fff;--ink:#23303d;--sub:#6f7d8a;--accent:#2f80ed;--accent2:#7cd3ff;--ok:#2e9e6a;--okbg:#e6f6ee;--no:#d64545;--nobg:#fdeaea;--line:#dde8f3;--hl:#ff7a45;--star:#ffb400}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,sans-serif;font-size:21px;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 56px}
  h1{font-family:"Nunito","Gowun Dodum",sans-serif;font-size:32px;margin:2px 0}
  h2{font-size:24px;margin:0 0 6px}
  .muted{color:var(--sub);font-size:18px}
  .card{background:var(--card);border-radius:22px;padding:20px 18px;box-shadow:0 6px 24px rgba(30,80,130,.08);margin-top:14px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .stat{background:#fff;border-radius:18px;padding:12px 6px;text-align:center;box-shadow:0 4px 14px rgba(30,80,130,.06)}
  .stat b{display:block;font-family:"Nunito",sans-serif;font-size:32px;font-weight:900}
  .stat span{font-size:16px;color:var(--sub)}
  .stages{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .stg{background:#fff;border-radius:20px;padding:14px;box-shadow:0 4px 14px rgba(30,80,130,.07);cursor:pointer;border:3px solid transparent;text-align:left;color:var(--ink);margin:0;font-weight:normal;font-size:20px;width:auto}
  .stg:active{border-color:var(--accent2)}
  .stg .n{font-size:15px;color:var(--accent);font-weight:bold}
  .stg .e{font-size:44px;line-height:1.2}
  .stg .t{font-weight:bold;font-size:22px}
  .stg .x{font-size:16px;color:var(--sub);font-family:"Nunito",sans-serif}
  .stars{color:var(--star);letter-spacing:1px;font-size:22px;margin-top:2px}
  .stars .off{color:#d6dde5}
  .back{background:none;color:var(--accent);width:auto;padding:4px 0;margin:0;font-size:20px}
  .modes{display:grid;gap:10px;margin-top:12px}
  .mode{display:flex;align-items:center;gap:14px;text-align:left;background:#f4f8fc;color:var(--ink);border:2px solid var(--line);margin:0}
  .mode .ic{font-size:42px}
  .mode small{display:block;font-weight:normal;color:var(--sub);font-size:17px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-family:"Nunito",sans-serif;font-weight:800;background:#f1f6fb;border-radius:99px;padding:5px 12px;font-size:20px}
  .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0;transition:width .3s}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:18px;color:var(--sub);margin-top:8px}
  .tag{display:inline-block;font-size:18px;padding:6px 14px;border-radius:99px;background:#e3f0ff;color:#1f5fb8;font-weight:bold}
  .q{font-size:25px;font-weight:bold;margin:12px 0 4px}
  .pic{font-size:110px;text-align:center;line-height:1.2;margin:6px 0}
  .word{font-family:"Nunito",sans-serif;font-weight:900;font-size:58px;text-align:center;letter-spacing:6px;margin:4px 0;word-break:break-all}
  .word .blank{color:var(--accent);border-bottom:5px solid var(--accent);padding:0 6px;display:inline-block;min-width:44px}
  .word .hl{color:var(--hl)}
  .speak{display:block;margin:6px auto 4px;width:auto;padding:12px 26px;font-size:23px;background:#fff;color:var(--accent);border:2px solid var(--accent);border-radius:99px}
  .opts{display:grid;gap:12px;margin-top:16px}
  .opts.c1{grid-template-columns:1fr}
  .opts.c1 .opt{font-size:36px;padding:12px}
  .opt{min-width:0;overflow-wrap:anywhere}
  .opts.c2{grid-template-columns:repeat(2,1fr)}
  .opts.c3{grid-template-columns:repeat(3,1fr)}
  .opts.c4{grid-template-columns:repeat(4,1fr)}
  .opt{font-family:"Nunito",sans-serif;font-weight:900;font-size:38px;padding:18px 4px;margin:0;background:#f4f8fc;color:var(--ink);border:3px solid var(--line);border-radius:18px}
  .opt.emo{font-size:60px;padding:10px 4px}
  .opt.small{font-size:30px}
  .opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
  .opt.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
  .slots{display:flex;justify-content:center;gap:8px;margin:10px 0;flex-wrap:wrap}
  .slot{width:56px;height:68px;border-bottom:5px solid var(--accent);font-family:"Nunito",sans-serif;font-weight:900;font-size:46px;text-align:center;line-height:68px}
  .tiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
  .tile{width:66px;height:66px;padding:0;margin:0;font-family:"Nunito",sans-serif;font-weight:900;font-size:36px;background:#fff7e6;color:var(--ink);border:3px solid #ffd98a;border-radius:14px}
  .tile.used{opacity:.25}
  button{font-family:inherit;font-size:22px;font-weight:bold;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;width:100%;margin-top:12px;background:var(--accent);color:#fff}
  button.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
  button.soft{background:#e9eff5;color:var(--ink)}
  button:disabled{opacity:1}
  .row{display:flex;gap:10px}.row button{flex:1}
  .fb{margin-top:14px;border-radius:14px;padding:14px 16px;display:none;text-align:center}
  .fb.ok{display:block;background:var(--okbg);color:var(--ok)}
  .fb.no{display:block;background:var(--nobg);color:var(--no)}
  .fb b{font-size:24px}
  .fb .ans{color:var(--ink);margin-top:4px;font-size:22px}
  .fb .ans span{font-family:"Nunito",sans-serif;font-weight:900;font-size:30px}
  .hidden{display:none}
  .score{font-family:"Nunito",sans-serif;font-size:64px;font-weight:900;text-align:center;margin:6px 0 0;color:var(--accent)}
  .center{text-align:center}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:18px}
  th,td{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--sub);font-weight:normal;font-size:15px}
  td.w{font-family:"Nunito",sans-serif;font-weight:900;font-size:21px}
  td.mine{color:var(--no);font-family:"Nunito",sans-serif;font-weight:800}
  .copied{color:var(--ok);font-size:17px;text-align:center;margin-top:6px;min-height:20px}
  .hist{list-style:none;padding:0;margin:8px 0 0}
  .hist li{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line);font-size:18px}
  .hist li b{font-family:"Nunito",sans-serif}
  .big-stars{font-size:48px;color:var(--star);text-align:center;letter-spacing:4px}
  .buddy{display:flex;align-items:center;gap:12px;margin-top:10px}
  .buddy img{width:96px;height:96px;object-fit:cover;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 14px rgba(30,80,130,.15);flex:none}
  .buddy.sm img{width:72px;height:72px}
  .buddy.big{flex-direction:column;text-align:center}
  .buddy.big img{width:150px;height:150px}
  .bubble{position:relative;background:#fff;border-radius:18px;padding:12px 16px;font-size:21px;font-weight:bold;box-shadow:0 4px 14px rgba(30,80,130,.08)}
  .fb .bubble{box-shadow:none;background:transparent;padding:0}
  .fb .buddy{justify-content:center}
  .jump{animation:jump .6s ease}
  .shake{animation:shake .5s ease}
  @keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
  .start-btn{background:linear-gradient(135deg,#ff9a3c,#ff6a3d);display:flex;align-items:center;gap:14px;text-align:left}
  .start-btn small{display:block;font-weight:normal;font-size:17px;color:#fff}
  .start-btn{color:#fff}
  .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:14px}
  .sbtn{margin:0;padding:12px 4px;background:#f4f8fc;color:var(--ink);border:3px solid var(--line);border-radius:18px;font-family:"Nunito",sans-serif;font-weight:900;font-size:36px;line-height:1.1}
  .sbtn small{display:block;font-family:"Gowun Dodum",sans-serif;font-size:19px;color:var(--hl);margin-top:4px}
  .sbtn .sw{display:block;font-size:15px;line-height:1.35;font-weight:800;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel{position:sticky;top:6px;z-index:2;box-shadow:0 4px 14px rgba(30,80,130,.10)}
  .sbtn.heard{border-color:var(--ok);background:var(--okbg)}
  .sbtn.on{border-color:var(--hl);background:#fff3ea}
  .panel{text-align:center;background:#fff8f2;border-radius:20px;padding:14px;margin-top:14px;min-height:120px}
  .panel .big{font-family:"Nunito",sans-serif;font-weight:900;font-size:min(72px,14vw);line-height:1.1}
  .panel .ko{font-size:34px;font-weight:bold;color:var(--hl)}
  .canvas-wrap{position:relative;margin-top:12px;border-radius:20px;overflow:hidden;background:#fff;border:3px solid var(--line)}
  #cv{display:block;width:100%;height:min(330px,40vh);touch-action:none;cursor:crosshair}
  .dots{font-size:30px;letter-spacing:6px;text-align:center;color:var(--ok)}
  .dots .off{color:#d6dde5}
  .trace-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:0}
  .trace-card{padding-top:12px}
  .trace-head .eng{font-family:"Nunito",sans-serif;font-weight:900;font-size:52px}
  .trace-head .ko{font-size:30px;font-weight:bold;color:var(--hl);white-space:nowrap}
  .trace-head .speak{padding:8px 16px}
  .trace-foot{display:flex;align-items:center;gap:10px;margin-top:8px}
  .trace-foot .dots{flex:1;text-align:left}
  .trace-foot button{width:auto;margin:0;padding:10px 16px;font-size:19px}
  .pct{font-family:"Nunito",sans-serif;font-weight:900;color:var(--accent);font-size:22px}
  .num{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;font-family:"Nunito",sans-serif;font-weight:900;font-size:22px;flex:none}
  .mode .num{margin-right:-4px}
  .mode.extra .num{background:#9fb3c8}
  .sec{font-size:17px;color:var(--sub);margin:14px 0 2px;font-weight:bold}
  .steps{display:flex;align-items:center;gap:3px;margin-top:10px;font-size:15px}
  .steps .st{flex:1;justify-content:center;display:flex;align-items:center;gap:4px;padding:6px 4px;border-radius:99px;background:#fff;color:var(--sub);white-space:nowrap}
  .steps .st b{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#d6dde5;color:#fff;align-items:center;justify-content:center;font-family:Nunito;font-size:15px}
  .steps .st.done b{background:var(--ok)}
  .steps .st.cur{background:var(--accent);color:#fff;font-weight:bold}
  .steps .st.cur b{background:#fff;color:var(--accent)}
  .steps .ar{color:#b5c3d1;flex:none}
  .steps .st:only-child{flex:none;padding:6px 14px}
  .stg .n b{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;margin-right:4px}
  .kw{font-family:"Gowun Dodum",sans-serif;font-weight:bold;color:var(--hl);font-size:.8em;letter-spacing:0;margin-left:4px}
  .kw.big{display:block;font-size:30px;margin:0}
  .mean{font-family:"Gowun Dodum",sans-serif;font-weight:bold;color:#2e9e6a;font-size:.8em;letter-spacing:0;margin-left:6px}
  .mean.big{display:block;font-size:28px;margin:2px 0 0;text-align:center}
  .kw.big{text-align:center}
  .upc{margin-left:.35em;color:#5b7fa8}
  .trace-head{flex-wrap:wrap;gap:6px 12px !important}
  .trace-head .eng{font-size:46px !important}
  .sbtn{min-width:0}
  .sbtn.long{font-size:26px}
  html{-webkit-text-size-adjust:100%}
  body{-webkit-user-select:none;user-select:none}
  button,.stg,.sbtn,.opt,.tile{touch-action:manipulation}
  canvas{-webkit-touch-callout:none;-webkit-user-select:none}
  /* ===== 한 화면에 들어오게 ===== */
  .wrap{padding:10px 12px 24px}
  .card{padding:14px 14px;margin-top:10px;border-radius:20px}
  summary{cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  .qhead{display:flex;align-items:center;gap:10px}
  .qhead .back{flex:none;font-size:24px;padding:2px 6px}
  .qhead .bar{flex:1;margin:0}
  .qhead .qn{flex:none;color:var(--sub);font-size:17px;font-family:Nunito,sans-serif;font-weight:800}
  .qcard{text-align:center}
  .qcard .tag{font-size:15px;padding:3px 12px}
  .q{font-size:clamp(18px,2.9vh,25px);margin:6px 0 2px}
  .pic{font-size:clamp(56px,12vh,110px);margin:2px 0}
  .word{font-size:clamp(38px,7vh,58px);margin:0}
  .speak{padding:7px 20px;font-size:20px;margin:4px auto}
  .opts{gap:10px;margin-top:10px}
  .opt{padding:12px 4px;font-size:clamp(28px,5vh,38px)}
  .opt.emo{font-size:clamp(40px,7vh,60px);padding:6px 4px}
  .opts.c1 .opt{font-size:clamp(26px,4.5vh,36px);padding:8px}
  .slot{width:46px;height:54px;line-height:54px;font-size:38px}
  .tiles{gap:8px;margin-top:8px}
  .tile{width:54px;height:54px;font-size:30px}
  .qcard .row button{margin-top:8px;padding:10px}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(30,80,130,.18);padding:12px 16px calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  .sheet .fb{display:block;margin:0;padding:6px 8px}
  .sheet button{margin-top:8px}
  .buddy.sm img{width:60px;height:60px}
  .buddy.sm .bubble{font-size:18px;padding:8px 12px}
  .buddy.big img{width:100px;height:100px}
  .pic[style*="110px"]{font-size:clamp(60px,13vh,110px)!important}
  .kw.big{font-size:24px}.mean.big{font-size:22px}
  .panel{padding:8px;min-height:0;margin-top:8px}
  .panel .big{font-size:min(56px,12vw)}
  .panel .ko{font-size:24px}
  .sgrid{max-height:calc(100dvh - 430px);min-height:160px;overflow:auto;gap:8px;margin-top:10px;padding:2px}
  .sbtn{padding:8px 4px;font-size:30px}
  .sbtn small{font-size:17px;margin-top:0}
  #cv{height:clamp(190px,calc(100dvh - 380px),330px)!important}
  .trace-head .eng{font-size:40px!important}
  .trace-head .ko{font-size:26px}
  .mode{padding:10px 12px;margin:0}
  .mode .ic{font-size:30px}
  .mode small{font-size:15px}
  .modes{gap:8px;margin-top:8px}
  .sec{margin:8px 0 0}
  .stages{gap:8px;margin-top:8px}
  .stg{padding:10px 12px}
  .stg .e{font-size:32px}
  .stats{margin-top:8px}
  .stat{padding:8px 4px}
  .score{font-size:52px}
  h1{font-size:28px}
  .hero{display:flex;align-items:center;gap:12px}
  .hero img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 4px 14px rgba(30,80,130,.15)}
  .hero h1{margin:0;line-height:1.15}
  .hero-say{font-size:17px;font-weight:bold;color:var(--accent)}
  .stages.s3{grid-template-columns:repeat(3,1fr)}
  .s3 .stg{text-align:center;padding:8px 4px}
  .s3 .stg .t{font-size:16px;line-height:1.25;word-break:keep-all}
  .s3 .stg .stars{font-size:16px}
  .s3 .stg .n{position:absolute}
  .stg{position:relative}
  .st-title{font-size:21px;font-weight:bold}
  .qhead .steps{margin:0;flex:1}
  .tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tiles3.t2{grid-template-columns:repeat(2,1fr)}
  .mtile{margin:0;padding:10px 4px;background:#f4f8fc;color:var(--ink);border:2px solid var(--line);border-radius:16px;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .mtile .num{width:28px;height:28px;font-size:16px}
  .mtile .ic{font-size:30px}
  .mtile.extra .num{background:#9fb3c8}
  .wl{margin-top:6px;font-size:17px;line-height:1.7;max-height:30vh;overflow:auto}
  .wl .mine{color:var(--no);font-weight:bold}
  .big-stars{font-size:34px;line-height:1.1}
  .big-stars .off{color:#d6dde5}
  .score{font-size:44px!important;margin:0}
  .wl{max-height:12vh}
  .copied{min-height:0!important;margin:2px 0!important}
  @media (min-height:800px){ .mtile{padding:16px 4px} .s3 .stg{padding:14px 4px} }
  a.btn{display:block;text-align:center;text-decoration:none;font-size:22px;font-weight:bold;border-radius:14px;padding:14px 18px;margin-top:10px;background:var(--accent);color:#fff}
  a.btn.mail{background:linear-gradient(135deg,#34a853,#2e9e6a)}
  .r3 button{font-size:17px;padding:10px 4px;line-height:1.3;margin-top:8px}
  .lv{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:8px 12px;margin-top:8px;box-shadow:0 4px 14px rgba(30,80,130,.06);text-align:left}
  .lv-e{font-size:40px;line-height:1}
  .lv.big .lv-e{font-size:50px}
  .lv-b{flex:1}
  .lv-t{font-size:21px}
  .lv-t b{font-family:Nunito,sans-serif;font-weight:900;color:var(--accent);font-size:24px}
  .xpbar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:3px 0}
  .xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd36e,#ff9a3c)}
  .lv-x{font-size:15px;color:var(--sub)}
  .card .lv{box-shadow:none;background:#f7fafd}
  .gain{font-family:Nunito,sans-serif;font-weight:900;font-size:22px;color:#ff7a00}
  .gain.neg{color:var(--no)}
  .xpup{display:inline-block;font-family:Nunito,sans-serif;font-weight:900;color:#ff7a00;font-size:.9em;animation:jump .6s}
  .xpdown{display:block;color:var(--no);font-size:.85em}
  .xpwarn{display:block;color:#c77800;font-size:.85em}
  .toast{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(20,40,60,.35)}
  .toast-in{background:#fff;border-radius:26px;padding:22px 26px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2);max-width:300px}
  .toast-in img{width:90px;height:90px;border-radius:50%;object-fit:cover}
  .toast-e{font-size:64px;line-height:1}
  .toast-in b{display:block;font-size:28px;margin-top:6px}
  .toast.up b{color:#ff7a00}
  .toast.down b{color:var(--no)}
  /* 조금 더 크게 */
  body{font-size:22px}
  .q{font-size:clamp(20px,3.3vh,28px)}
  .pic{font-size:clamp(64px,14vh,124px)}
  .word{font-size:clamp(44px,8vh,64px)}
  .opt{font-size:clamp(32px,6vh,44px);padding:14px 4px}
  .opt.emo{font-size:clamp(46px,8vh,66px)}
  .opts.c1 .opt{font-size:clamp(30px,5vh,40px)}
  .speak{font-size:22px;padding:8px 22px}
  .slot{width:52px;height:60px;line-height:60px;font-size:42px}
  .tile{width:60px;height:60px;font-size:34px}
  .mtile{font-size:21px}
  .mtile .ic{font-size:36px}
  .mtile .num{width:32px;height:32px;font-size:18px}
  .s3 .stg .t{font-size:19px}
  .stg .e{font-size:38px}
  .s3 .stg .stars{font-size:18px}
  .stat b{font-size:30px}
  .stat span{font-size:16px}

function setupCanvas(text,onDone){
  const cv=document.getElementById("cv");
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  const mk=()=>{const c=document.createElement("canvas");c.width=W;c.height=H;return c};
  const ink=mk(), ictx=ink.getContext("2d"), fill=mk(), dil=mk();
  let fs, base, inkW, samples=[], dilData, finished=false;
  function layout(){
    const fam='900 {S}px Nunito, "Arial Rounded MT Bold", Arial, sans-serif';
    fs=H*0.86; ctx.font=fam.replace("{S}",fs);
    const w=ctx.measureText(text).width; if(w>W*0.86) fs=fs*W*0.86/w;
    base=H*0.72; inkW=Math.max(14,fs*0.14);
    const font=fam.replace("{S}",fs);
    [fill,dil].forEach((c,i)=>{const x=c.getContext("2d");x.font=font;x.textAlign="center";x.textBaseline="alphabetic";x.fillStyle="#000";x.fillText(text,W/2,base);
      if(i===1){x.lineWidth=inkW*1.5;x.lineJoin="round";x.strokeStyle="#000";x.strokeText(text,W/2,base)}});
    const fd=fill.getContext("2d").getImageData(0,0,W,H).data; const step=Math.max(3,Math.round(fs/40));
    samples=[]; for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){ if(fd[(y*W+x)*4+3]>128) samples.push([x,y]) }
    dilData=dil.getContext("2d").getImageData(0,0,W,H).data;
    ictx.lineCap="round"; ictx.lineJoin="round"; ictx.lineWidth=inkW; ictx.strokeStyle="#2f80ed";
    ctx._font=font; render();
  }
  function render(){
    ctx.clearRect(0,0,W,H);
    // 영어 공책 줄
    const lines=[base-fs*0.72, base-fs*0.5, base, base+fs*0.2];
    lines.forEach((y,i)=>{ctx.beginPath();ctx.setLineDash(i===2?[]:[8,8]);ctx.strokeStyle=i===2?"#f3a0a0":"#c9d6e3";ctx.lineWidth=2;ctx.moveTo(10,y);ctx.lineTo(W-10,y);ctx.stroke()});
    ctx.setLineDash([]);
    ctx.font=ctx._font; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
    ctx.fillStyle="#e9eff6"; ctx.fillText(text,W/2,base);
    ctx.setLineDash([6,7]); ctx.lineWidth=3; ctx.strokeStyle="#9fb3c8"; ctx.strokeText(text,W/2,base); ctx.setLineDash([]);
    ctx.drawImage(ink,0,0,W,H);
  }
  function pos(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
  let drawing=false,last=null;
  cv.onpointerdown=e=>{ if(finished) return; drawing=true; cv.setPointerCapture(e.pointerId); last=pos(e); ictx.beginPath(); ictx.arc(last[0],last[1],inkW/2,0,7); ictx.fillStyle="#2f80ed"; ictx.fill(); render(); };
  cv.onpointermove=e=>{ if(!drawing) return; const p=pos(e); ictx.beginPath(); ictx.moveTo(last[0],last[1]); ictx.lineTo(p[0],p[1]); ictx.stroke(); last=p; render(); };
  const up=()=>{ if(!drawing) return; drawing=false; check(); };
  cv.onpointerup=up; cv.onpointercancel=up; cv.onpointerleave=up;
  function check(){
    const id=ictx.getImageData(0,0,W,H).data;
    let hit=0; samples.forEach(([x,y])=>{ if(id[(y*W+x)*4+3]>40) hit++ });
    const cov=samples.length?hit/samples.length:0;
    let inkPts=0,out=0; for(let y=0;y<H;y+=4)for(let x=0;x<W;x+=4){ const k=(y*W+x)*4+3; if(id[k]>40){inkPts++; if(dilData[k]<100) out++} }
    const outR=inkPts?out/inkPts:0, msg=document.getElementById("msg");
    if(cov>=0.62 && outR<0.3){ finished=true; onDone(true); }
    else if(outR>=0.3 && inkPts>30){ msg.innerHTML=`<span style="color:var(--no)">선 밖으로 많이 나갔어! 🧽 지우고 다시 써 볼까?</span>`; }
    else if(cov>0.15){ msg.innerHTML=`조금만 더! 회색 글자를 다 덮어 봐 (${Math.round(Math.min(cov/0.62,1)*100)}%)`; }
  }
  document.getElementById("clr").onclick=()=>{ if(finished) return; ictx.clearRect(0,0,W,H); document.getElementById("msg").textContent=""; render(); };
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(layout);
}

    body=`<div class="tag">${TLABEL.listen}</div><div class="q">${o.mode==="guided"?"듣고 맞는 단어를 눌러요 (주황색이 이번 소리)":"듣고 맞는 철자를 고르세요"}</div>
    <button class="speak" id="sp" style="font-size:28px;padding:14px 30px">🔊 듣기</button>
    <div class="opts c1">${q.opts.map(w=>{const y=ALL.find(a=>a.word===w&&a.st===st)||{word:w,p:"",st};return `<button class="opt" data-v="${esc(w)}">${o.mode==="guided"&&y.p?hlWord(y):esc(w)}</button>`}).join("")}</div>`;
  }else{
    const nw=q.t==="nonword";
    body=`<div class="tag">${nw?TLABEL.nonword:TLABEL.sortp}</div><div class="q">${nw?"처음 보는 글자예요! 어떤 소리가 들어 있을까?":"이 단어에 들어 있는 소리(철자)는?"}</div>
    <div class="word">${esc(q.word)}</div><button class="speak" id="sp">🔊 ${nw?"읽어 줄까요?":"듣기"}</button>
    <div class="opts c3">${q.opts.map(p=>`<button class="opt small" data-v="${esc(p)}">${both(st,p)}</button>`).join("")}</div>`;
  }
  $app.innerHTML=`${head}<div class="card qcard">${body}</div><div id="sheet"></div>`;
  const bk=document.getElementById("bk"); if(bk) bk.onclick=()=>{ if(confirm("그만할까요? (오늘 코스는 이어서 할 수 있어요)")) o.onExit&&o.onExit() };
  const sp=document.getElementById("sp"); if(sp) sp.onclick=()=>speak(q.word);
  if(q.t==="dictate"||q.t==="listen") setTimeout(()=>speak(q.word),350);

  function ansText(){return q.t==="dictate"||q.t==="listen"?esc(q.word):both(st,x.p)}
  function judge(ok,mine,btn){
    if(answered) return; tries++;
    if(o.mode==="guided"){
      if(ok){answered=true;if(btn)btn.classList.add("right");speak(q.word);setTimeout(()=>cb(true,tries===1),900)}
      else{ if(btn){btn.classList.add("wrong");btn.disabled=true} const s=document.getElementById("sheet");s.innerHTML=`<div class="sheet"><div class="fb no" style="display:block">${buddy("아깝다! 다시 한 번 들어 보자 🎧","sm")}</div></div>`;setTimeout(()=>{const e=document.getElementById("sheet");if(e)e.innerHTML=""},1300);speak(q.word) }
      return;
    }
    answered=true;
    if(btn) btn.classList.add(ok?"right":"wrong");
    if(ok){ if(btn) btn.classList.add("jump"); setTimeout(()=>cb(true,mine),750); return; }
    speak(q.word);
    if(q.t!=="dictate"){document.querySelectorAll(".opt").forEach(b=>{if(b.dataset.v===(q.t==="listen"?q.word:x.p)) b.classList.add("right")})}
    document.getElementById("sheet").innerHTML=`<div class="sheet"><div class="fb no" style="display:block">${buddy("괜찮아, 이 소리는 이따 같이 공부하자!","sm","shake")}
      <div class="ans">정답: <span>${ansText()}</span> ${q.t==="dictate"||q.t==="listen"?kw(q.word):""}</div></div><button id="nx">다음 →</button></div>`;
    document.getElementById("nx").onclick=()=>cb(false,mine);
  }
  if(q.t==="dictate"){
    const slots=[...document.querySelectorAll(".slot")];
    function draw(){slots.forEach((s,i)=>s.textContent=chosen[i]?chosen[i].c:"")}
    document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
      if(answered||t.classList.contains("used")||chosen.length>=q.word.length) return;
      t.classList.add("used"); chosen.push({c:t.textContent,el:t}); draw();
      if(chosen.length===q.word.length){const mine=chosen.map(a=>a.c).join("");const ok=mine===q.word;slots.forEach(s=>s.style.color=ok?"var(--ok)":"var(--no)");judge(ok,mine,null)}
    });
    document.getElementById("bs").onclick=()=>{if(answered)return;const l=chosen.pop();if(l)l.el.classList.remove("used");draw()};
  }else{
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const v=b.dataset.v; const ok=q.t==="listen"?v===q.word:v===x.p; judge(ok,v,b);
    });
  }
}
/* 여러 문제 연속 */
function runQs(qs,o,done){
  let i=0,res=[];
  const mk=()=>`<div class="qhead"><button class="back" id="bk">✕</button><span class="qn">${esc(o.tag||"")}</span><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><span class="qn">${i+1}/${qs.length}</span></div>`;
  function show(){
    if(i>=qs.length) return done(res);
    const q=qs[i];
    qCard(q,{head:mk(),mode:o.mode||"normal",onExit:o.onExit},(ok,mine)=>{
      res.push({sk:q.sk,x:q.x,type:q.t,ok,mine,q});
      if(o.mast&&(o.mode||"normal")==="normal"){upd(q.sk,ok);if(!ok&&q.t!=="dictate"&&q.t!=="listen"&&mine)S.conf[q.sk]=mine;save()}
      i++;show();
    });
  }
  show();
}

/* ---------- 소리 고르기 (오늘의 시작 체크) ---------- */
function pickKeys(n,exclude){
  exclude=exclude||[];
  const keys=SKEYS.filter(k=>!exclude.includes(k));
  const seen=keys.filter(k=>mval(k)!=null);
  if(seen.length<6){ // 처음: 여러 단계에서 골고루 (진단)
    const by={};shuffle(keys).forEach(k=>{(by[k.split(":")[0]]=by[k.split(":")[0]]||[]).push(k)});
    const out=[];let more=true;while(out.length<n&&more){more=false;for(const s of Object.keys(by)){if(by[s].length&&out.length<n){out.push(by[s].shift());more=true}}}
    return out;
  }
  const out=[];const add=a=>a.forEach(k=>{if(out.length<n&&!out.includes(k))out.push(k)});
  add(keys.filter(k=>S.due[k]&&S.due[k]<=today()).slice(0,3));
  add(seen.slice().sort((a,b)=>mval(a)-mval(b)).slice(0,5-out.length>0?5:0));
  const unseenOrOld=keys.filter(k=>!out.includes(k)).sort((a,b)=>((S.mast[a]&&S.mast[a].last)||0)-((S.mast[b]&&S.mast[b].last)||0));
  add(unseenOrOld.slice(0,3));
  add(seen.slice().sort((a,b)=>mval(b)-mval(a)).slice(0,2));
  add(shuffle(keys));
  return shuffle(out);
}
function buildQs(keys,avoid){return keys.map(k=>genQ(k,avoid))}

function startCheck(){
  const d=D(); d.used=d.used||[]; const avoid=new Set(d.used);
  const first=Object.keys(S.mast).length<6; const keys=pickKeys(first?12:10);
  const qs=buildQs(keys,avoid); d.used=[...avoid]; d.t0=d.t0||Date.now(); save();
  runQs(qs,{tag:first?"진단":"시작 체크",mast:true,onExit:renderCourse},res=>{
    const ok=res.filter(r=>r.ok).length, pct=Math.round(ok/res.length*100);
    const wrongK={};res.forEach(r=>{if(!r.ok)wrongK[r.sk]=(wrongK[r.sk]||0)+1});
    let weak=Object.keys(wrongK).sort((a,b)=>wrongK[b]-wrongK[a]||mval(a)-mval(b)).slice(0,3);
    if(weak.length<2){const low=SKEYS.filter(k=>mval(k)!=null&&!weak.includes(k)).sort((a,b)=>mval(a)-mval(b));for(const k of low){if(weak.length>=2)break;weak.push(k)}}
    d.start={pct,n:res.length,ok,weak,wrong:Object.keys(wrongK)};
    d.pre={};weak.forEach(k=>d.pre[k]=mval(k));
    d.stars=pct>=90?3:pct>=70?2:pct>=50?1:0;

  });
}

function endCheck(){

/* ---------- 소리 하나 공부 (카드 → 비교 → 도와주며 → 혼자) ---------- */
function studySound(sk,o,done){
  const sd=SOUNDS[sk],st=sd.st,p=sd.p,t0=Date.now();
  const conf=S.conf[sk]&&SOUNDS[st.id+":"+S.conf[sk]]?st.id+":"+S.conf[sk]:null;
  const dots=n=>`<span class="qn">${["①","②","③","④"].map((c,i)=>i===n?`<b style="color:var(--accent)">${c}</b>`:c).join(" ")}</span>`;
  const head=n=>`<div class="qhead"><button class="back" id="bk">✕</button><span class="qn">${esc(label(st,p))}</span><div class="bar"><i style="width:${(n+1)*25}%"></i></div>${dots(n)}</div>`;
  const exit=()=>{if(o.onExit)o.onExit()};
  function wordRow(x){return `<div class="mode wr" data-w="${esc(x.word)}" style="margin-top:6px"><span class="ic">${x.pic}</span><span style="font-family:Nunito;font-weight:900;font-size:30px">${hlWord(x)} ${kw(x.word)}</span></div>`}
  function card(){
    $app.innerHTML=`${head(0)}<div class="card center"><div class="panel" style="margin-top:0"><div class="big">${both(st,p)}</div><div class="ko">"${esc(st.ko[p]||"")}"</div></div>
     <div class="muted" style="margin-top:6px">눌러서 들어 보세요 🔊</div>${sd.words.slice(0,3).map(wordRow).join("")}<button id="nx">다음 →</button></div>`;
    wire(); document.getElementById("nx").onclick=conf?pair:guided;
  }
  function wire(){document.getElementById("bk").onclick=()=>{if(confirm("그만할까요?"))exit()};document.querySelectorAll(".wr").forEach(r=>r.onclick=()=>speak(r.dataset.w))}
  function pair(){
    const o2=SOUNDS[conf];
    $app.innerHTML=`${head(1)}<div class="card center">${buddy("헷갈리기 쉬운 두 소리를 비교해 보자!","sm")}
     <div class="row" style="align-items:stretch"><div style="flex:1"><div class="word" style="font-size:40px;color:var(--hl)">${both(st,p)}</div>${sd.words.slice(0,2).map(wordRow).join("")}</div>
     <div style="flex:1"><div class="word" style="font-size:40px;color:var(--accent)">${both(o2.st,o2.p)}</div>${o2.words.slice(0,2).map(wordRow).join("")}</div></div>
     <button id="nx">다음 →</button></div>`;
    wire(); document.getElementById("nx").onclick=guided;
  }
  function guided(){
    const avoid=new Set(),qs=[];
    for(let i=0;i<3;i++){const q=genQ(sk,avoid,"listen");q.opts=shuffle([q.word,q.opts.find(w=>w!==q.word)]);qs.push(q)}
    runQs(qs,{tag:"도와주며",mode:"guided",onExit:exit},()=>{
      if(!o.free&&Date.now()-t0>5*60000){dueIn(sk,1);return done()}
      solo();
    });
  }
  function solo(){
    const avoid=new Set(),qs=[genQ(sk,avoid,"dictate"),genQ(sk,avoid,NW[sk]?"nonword":(st.noSort?"listen":"sortp"))];
    runQs(qs,{tag:"혼자 풀기",mast:true,onExit:exit},res=>{
      const ok=res.every(r=>r.ok);

      $app.innerHTML=`<div class="card center"><h2>${ok?"통과! 🎉":"조금만 더!"}</h2>${buddy(ok?`${esc(label(st,p))} 소리, 이제 잘 알아요!`:"괜찮아! 내일 맨 먼저 다시 해 보자.","big",ok?"jump":"")}<button id="nx">${o.n?"다음 소리 →":"끝내기"}</button></div>`;
      document.getElementById("nx").onclick=done;
    });
  }

}
/* ---------- 결과·아빠 리포트 ---------- */
function streakDays(){let n=0;const d=new Date();for(let i=0;i<400;i++){const k=isoDay(d);const r=S.days[k];if(r&&r.fixDone)n++;else if(i>0)break;d.setDate(d.getDate()-1)}return n}
function finishDay(){
  const d=D(); if(d.xpGiven!=null||!d.end) return null;
  const weak=d.start.weak;
  const improved=weak.filter(k=>{const w=(d.end.weakRes||[]).find(a=>a.sk===k);return (w&&w.n>0&&w.ok===w.n)||(mval(k)||0)>(d.pre[k]==null?0:d.pre[k])+0.04}).length;
  const total=Math.min(DAY_CAP,60+Math.min(30,improved*10)+Math.min(20,(d.stamps||0)*5));
  const r=addXP(total); d.xpGiven=r.gain; d.lvUp=r.newL>r.oldL?r.newL:0; d.improved=improved;
  S.hist.unshift({date:today(),s:d.start.pct,e:d.end.pct,xp:r.gain});S.hist=S.hist.slice(0,60);
  save(); return r;
}
function reportText(){
  const d=D(),L=lvOf(S.xp),{r,part}=robotInfo(L),dt=new Date();
  const wk=(d.start&&d.start.weak||[]).map(k=>{const a=d.pre&&d.pre[k]!=null?Math.round(d.pre[k]*100):"?";return `${slabel(k)} ${a}→${Math.round((mval(k)||0)*100)}%`});
  const mins=d.t0?Math.max(1,Math.round((Date.now()-d.t0)/60000)):"-";
  return `[설훈이 오늘 공부 ${dt.getMonth()+1}/${dt.getDate()}]\n시작 체크 ${d.start?d.start.pct:"-"}% → 마무리 체크 ${d.end?d.end.pct:"-"}%\n공부한 소리: ${wk.join(", ")||"-"}\n복습 도장 ${d.stamps||0}개 · 약 ${mins}분\nXP +${d.xpGiven||0} · 레벨 ${L} (${r}호 ${RC[r-1][0]} ${part}/10)\n연속 공부 ${streakDays()}일`;

function startDict(li){
  const l=S.dict[li],items=shuffle(l.words);let i=0;const wrong=[];
  function show(){
    if(i>=items.length) return done();
    const w=items[i];
    $app.innerHTML=`<div class="qhead"><button class="back" id="bk">✕</button><span class="qn">받아쓰기</span><div class="bar"><i style="width:${i/items.length*100}%"></i></div><span class="qn">${i+1}/${items.length}</span></div>
    <div class="card center"><div class="tag">${i+1}번</div><div class="q">잘 듣고 써 보세요</div><button class="speak" id="sp" style="font-size:28px;padding:14px 30px">🔊 다시 듣기</button>
    <input id="an" class="inp" style="font-size:28px;text-align:center" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="ck">확인</button></div><div id="sheet"></div>`;
    document.getElementById("bk").onclick=()=>{if(confirm("그만할까요?"))go("dict")};
    document.getElementById("sp").onclick=()=>speakKo(w); setTimeout(()=>speakKo(w),300);
    const an=document.getElementById("an");
    const chk=()=>{const mine=norm(an.value);if(!mine)return;const ok=mine===w;
      if(ok){i++;show();return}
      wrong.push({w,mine});
      document.getElementById("sheet").innerHTML=`<div class="sheet"><div class="fb no" style="display:block">${buddy("괜찮아, 맞춤법을 같이 보자!","sm")}<div class="ans">정답: <span style="font-family:inherit">${diffHTML(w,mine)}</span><br><span class="muted">내가 쓴 것: ${esc(mine)}</span></div></div><button id="nx">다음 →</button></div>`;
      document.getElementById("nx").onclick=()=>{i++;show()};
    };
    document.getElementById("ck").onclick=chk; an.onkeydown=e=>{if(e.key==="Enter")chk()};
  }
  function done(){
    const ok=items.length-wrong.length,sc=Math.round(ok/items.length*100);
    if(l.best==null||sc>l.best)l.best=sc;save();
    $app.innerHTML=`<div class="card center"><h2>받아쓰기 결과</h2><div class="score">${sc}점</div><div class="muted">${ok}/${items.length} · 점수는 첫 도전만 기록돼요</div>
    ${wrong.length?`<div class="wl" style="text-align:left">${wrong.map(x=>`<b>${esc(x.w)}</b> ← <span class="mine">${esc(x.mine)}</span>`).join("<br>")}</div><button id="st">틀린 것 공부하기 →</button>`:buddy("전부 맞았어! 대단해!","big","jump")}
    <button class="ghost" id="bk2">목록으로</button></div>`;
    document.getElementById("bk2").onclick=()=>go("dict");
    const st=document.getElementById("st");if(st)st.onclick=()=>studyWrong(wrong.map(x=>x.w),0);
  }
  function studyWrong(list,k){
    if(k>=list.length){$app.innerHTML=`<div class="card center"><h2>정리 끝! 💮</h2>${buddy("틀린 것을 3번씩 써 봤어요!","big","jump")}<button id="bk2">목록으로</button></div>`;document.getElementById("bk2").onclick=()=>go("dict");return}
    const w=list[k];let n=0;
    $app.innerHTML=`<div class="card center"><div class="tag">틀린 것 공부 ${k+1}/${list.length}</div><div class="word" style="font-size:36px;letter-spacing:0">${esc(w)}</div><button class="speak" id="sp">🔊 듣기</button><div class="muted" id="c">똑같이 3번 써 보세요 (0/3)</div><input id="an" class="inp" style="font-size:26px;text-align:center" autocomplete="off"><button id="ck">확인</button></div>`;
    document.getElementById("sp").onclick=()=>speakKo(w);speakKo(w);
    document.getElementById("ck").onclick=()=>{const v=norm(document.getElementById("an").value);if(v!==w){document.getElementById("c").innerHTML=`<span style="color:var(--no)">다시 한 번 정확히 써 보세요</span>`;return}n++;document.getElementById("an").value="";document.getElementById("c").textContent=`똑같이 3번 써 보세요 (${n}/3)`;if(n>=3)studyWrong(list,k+1)};
  }
  show();
}

/* ---------- 수학 (연산 연습, 진도표 받으면 맞춤) ---------- */
const MUNITS={
 add:{n:"덧셈과 뺄셈 (세 자리)",ic:"➕"},mul:{n:"곱셈 (두 자리×한 자리)",ic:"✖️"},div:{n:"나눗셈 (몫 구하기)",ic:"➗"},unit:{n:"시간·길이·무게",ic:"📏"}
};
function genMath(u){
  const r=(a,b)=>a+rand(b-a+1);
  if(u==="add"){ if(Math.random()<.5){const a=r(120,780),b=r(110,999-a);return {q:`${a} + ${b} = ?`,a:a+b,ex:`${a} + ${b} = ${a+b}\n일의 자리부터 차례로 더하고, 10이 넘으면 올려 주세요.`}}
    const a=r(300,999),b=r(110,a-50);return {q:`${a} − ${b} = ?`,a:a-b,ex:`${a} − ${b} = ${a-b}\n일의 자리부터 빼고, 모자라면 위에서 10을 빌려 와요.`}}
  if(u==="mul"){const a=r(12,49),b=r(2,9);return {q:`${a} × ${b} = ?`,a:a*b,ex:`${a} × ${b} = ${a*b}\n${Math.floor(a/10)*10} × ${b} = ${Math.floor(a/10)*10*b}, ${a%10} × ${b} = ${a%10*b} → 더하면 ${a*b}`}}
  if(u==="div"){const b=r(2,9),q=r(3,12);return {q:`${b*q} ÷ ${b} = ?`,a:q,ex:`${b*q} ÷ ${b} = ${q}\n${b} × ${q} = ${b*q} 이니까 몫은 ${q}!`}}
  const t=rand(5);
  if(t===0){const h=r(1,4),m=r(5,55);return {q:`${h}시간 ${m}분은 몇 분일까요?`,a:h*60+m,ex:`1시간 = 60분 → ${h}×60 + ${m} = ${h*60+m}`}}
  if(t===1){const k=r(1,5),m=r(100,900);return {q:`${k} km ${m} m는 몇 m일까요?`,a:k*1000+m,ex:`1 km = 1000 m → ${k*1000} + ${m} = ${k*1000+m}`}}
  if(t===2){const k=r(1,5),g=r(100,900);return {q:`${k} kg ${g} g은 몇 g일까요?`,a:k*1000+g,ex:`1 kg = 1000 g → ${k*1000} + ${g} = ${k*1000+g}`}}
  if(t===3){const k=r(1,5),m=r(100,900);return {q:`${k} L ${m} mL는 몇 mL일까요?`,a:k*1000+m,ex:`1 L = 1000 mL → ${k*1000} + ${m} = ${k*1000+m}`}}
  const c=r(1,9),m=r(1,9);return {q:`${c} cm ${m} mm는 몇 mm일까요?`,a:c*10+m,ex:`1 cm = 10 mm → ${c*10} + ${m} = ${c*10+m}`};
}
function renderMath(){
  $app.innerHTML=`<button class="back" id="bk">← 학교 공부</button><div class="card"><h2>➗ 수학</h2><div class="muted">지금은 3학년 기본 연산 연습이에요. 교과서 차례를 알려 주시면 진도별 문제·단원평가·성취도평가로 바꿔요.</div>
  <div class="modes">${Object.keys(MUNITS).map(u=>`<button class="mode" data-u="${u}"><span class="ic">${MUNITS[u].ic}</span><span>${MUNITS[u].n}<small>10문제${S.mathBest[u]!=null?` · 첫 도전 최고 ${S.mathBest[u]}%`:""}</small></span></button>`).join("")}</div></div>`;
  document.getElementById("bk").onclick=()=>go("school");
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>runMath(b.dataset.u));
}
function numPad(onKey){
  return `<div class="pad">${["1","2","3","4","5","6","7","8","9","⌫","0","확인"].map(k=>`<button class="${k==="확인"?"":"soft"}" data-k="${k}">${k}</button>`).join("")}</div>`;
}
function runMath(u){
  const first=!(S.days[today()]&&S.days[today()]["m_"+u]);
  const qs=Array.from({length:10},()=>genMath(u));let i=0,ok=0;const wrong=[];
  function show(){
    if(i>=qs.length) return fin();
    const q=qs[i];let val="";
    $app.innerHTML=`<div class="qhead"><button class="back" id="bk">✕</button><span class="qn">${MUNITS[u].n.split(" ")[0]}</span><div class="bar"><i style="width:${i/10*100}%"></i></div><span class="qn">${i+1}/10</span></div>
    <div class="card center"><div class="q" style="font-size:30px">${esc(q.q)}</div><div class="word" id="v" style="min-height:70px;letter-spacing:2px">&nbsp;</div>${numPad()}</div><div id="sheet"></div>`;
    document.getElementById("bk").onclick=()=>{if(confirm("그만할까요?"))go("math")};
    const v=document.getElementById("v");
    document.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if(k==="⌫")val=val.slice(0,-1);else if(k==="확인"){if(!val)return;const okk=+val===q.a;if(okk){ok++;i++;show()}else{wrong.push(q);document.getElementById("sheet").innerHTML=`<div class="sheet"><div class="fb no" style="display:block">${buddy("괜찮아, 풀이를 보자!","sm")}<div class="ans" style="white-space:pre-line">${esc(q.ex)}</div></div><button id="nx">다음 →</button></div>`;document.getElementById("nx").onclick=()=>{i++;show()}}return}
      else if(val.length<6)val+=k;
      v.textContent=val||" ";
    });
  }
  function fin(){
    const pct=ok*10;
    if(first){const d=D();d["m_"+u]=pct;if(S.mathBest[u]==null||pct>S.mathBest[u])S.mathBest[u]=pct;save()}
    $app.innerHTML=`<div class="card center"><h2>${MUNITS[u].n.split(" ")[0]} 결과</h2><div class="score">${pct}%</div><div class="muted">${first?"오늘 첫 도전 점수가 기록돼요":"오늘 두 번째부터는 연습으로만 기록돼요"}</div>
    ${wrong.length?`<div class="wl" style="text-align:left;white-space:pre-line">${wrong.map(q=>esc(q.q.replace(" = ?","")+" = "+q.a)).join("\n")}</div><button id="st">틀린 것 공부하기 →</button>`:buddy("전부 맞았어!","big","jump")}<button class="ghost" id="bk2">수학 메뉴</button></div>`;
    document.getElementById("bk2").onclick=()=>go("math");
    const st=document.getElementById("st");if(st)st.onclick=()=>studyM(wrong.slice(),0);
  }
  function studyM(list,k){
    if(k>=list.length){go("math");return}
    const q=list[k],nq=genMath(u);let val="";
    $app.innerHTML=`<div class="card center"><div class="tag">틀린 것 공부 ${k+1}/${list.length}</div><div class="q" style="font-size:26px">${esc(q.q)}</div><div class="fb ok" style="display:block;color:var(--ink);white-space:pre-line;text-align:left;background:#fff8e6">${esc(q.ex)}</div>
    <div class="q" style="font-size:26px;margin-top:10px">비슷한 새 문제: ${esc(nq.q)}</div><div class="word" id="v" style="min-height:60px">&nbsp;</div>${numPad()}</div>`;
    const v=document.getElementById("v");
    document.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>{const kk=b.dataset.k;if(kk==="⌫")val=val.slice(0,-1);else if(kk==="확인"){if(+val===nq.a)studyM(list,k+1);else{val="";v.innerHTML=`<span style="color:var(--no);font-size:24px">다시 계산해 봐요</span>`}return}else if(val.length<6)val+=kk;v.textContent=val||" "});
  }
  show();
}

  <button class="mode" id="m"><span class="ic">➗</span><span>수학<small>연산 연습 (진도별·단원평가는 준비 중)</small></span></button>
  <button class="mode" id="k"><span class="ic">📝</span><span>국어<small>받아쓰기 (진도별·단원평가는 준비 중)</small></span></button></div></div>`;
